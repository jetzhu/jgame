<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jgame</title>
  <meta name="description" content="Free browser games. No login required.">
  <meta name="theme-color" content="#1d1c1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2381b64c'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='800' text-anchor='middle' fill='%23fff'%3Ej%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#1d1c1a; --card:#2a2926; --card-hover:#34332f; --text:#fff; --muted:#a9a7a2; --accent:#81b64c; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 56px 16px 40px; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); margin: 8px 0 40px; font-size: 1.1rem; }
    h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .game { display: flex; flex-direction: column; background: var(--card); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; transition: background .15s, transform .15s; }
    .game:hover { background: var(--card-hover); transform: translateY(-2px); }
    .thumb { aspect-ratio: 16/9; display: grid; place-items: center;
      background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 4.5' preserveAspectRatio='none' shape-rendering='crispEdges'><rect width='8' height='5' fill='%23ebecd0'/><path fill='%23739552' d='M1 0h1v1h-1zM3 0h1v1h-1zM5 0h1v1h-1zM7 0h1v1h-1zM0 1h1v1h-1zM2 1h1v1h-1zM4 1h1v1h-1zM6 1h1v1h-1zM1 2h1v1h-1zM3 2h1v1h-1zM5 2h1v1h-1zM7 2h1v1h-1zM0 3h1v1h-1zM2 3h1v1h-1zM4 3h1v1h-1zM6 3h1v1h-1zM1 4h1v1h-1zM3 4h1v1h-1zM5 4h1v1h-1zM7 4h1v1h-1z'/></svg>") 0 0 / 100% 100%; }
    .thumb b { font-size: 4.2rem; line-height: 1; color: #fff; text-shadow: 0 2px 0 #262421, 0 0 1px #262421, 2px 0 0 #262421, -2px 0 0 #262421, 0 -2px 0 #262421; }
    .info { padding: 14px 16px 16px; }
    .info h3 { margin: 0 0 4px; font-size: 1.15rem; }
    .info p { margin: 0; color: var(--muted); font-size: .93rem; }
    .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .tags span { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: #ffffff12; color: var(--muted); }
    footer { margin-top: 56px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>j<span>game</span></h1>
    <p class="lead">Free browser games. No accounts, no downloads, just play.</p>

    <h2>Games</h2>
    <div class="grid">
      <!-- Add a game: copy one <a class="game"> card and change the link, title and text. -->
      <a class="game" href="/chess_playground/">
        <div class="thumb"><b>♞</b></div>
        <div class="info">
          <h3>Chess Playground</h3>
          <p>Play against the computer at 10 levels, or play a friend online with a share link or on the same device.</p>
          <div class="tags"><span>1 player</span><span>2 players</span><span>Online</span></div>
        </div>
      </a>
    </div>

    <footer>jgame.duckdns.org</footer>
  </main>
</body>
</html>
